# Só LÊ informações da VM (sistema, memória, disco, o que já está
# instalado/rodando) antes da migração. Não altera nada. Não imprime
# nenhuma senha (o log do Actions é público).
name: VM - reconhecimento

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vm-reconhecimento.yml

permissions:
  contents: read

jobs:
  vm:
    runs-on: ubuntu-latest
    steps:
      - name: Ler informações da VM
        env:
          VM_IP: ${{ secrets.VM_IP }}
          USER_VM: ${{ secrets.USER_VM }}
          SSHPASS: ${{ secrets.PSW_VM }}
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$USER_VM@$VM_IP" 'bash -s' <<'REMOTO'
          echo "== projeto vanguard (compose)"; sudo -n docker inspect vanguard-web-1 --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }} | arquivos: {{ index .Config.Labels "com.docker.compose.project.config_files" }}'
          echo "== montagens do web"; sudo -n docker inspect vanguard-web-1 --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}'
          echo "== redes"; sudo -n docker inspect vanguard-web-1 --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}'
          echo "== sites no Caddyfile (só endereços e destinos)"; sudo -n docker exec vanguard-web-1 sh -c 'cat /etc/caddy/Caddyfile 2>/dev/null' | grep -E '^\S.*\{|reverse_proxy|import|^\}' | head -30
          echo "== imagem do web"; sudo -n docker inspect vanguard-web-1 --format '{{.Config.Image}} | entrypoint: {{.Config.Entrypoint}} {{.Config.Cmd}}'
          echo "== reinício automático"; for c in vanguard-web-1 vanguard-api-1 vanguard-db-1; do sudo -n docker inspect $c --format "$c {{.HostConfig.RestartPolicy.Name}}"; done
          REMOTO
