# Só LÊ informações da VM (sistema, memória, disco, o que já está
# instalado/rodando) antes da migração. Não altera nada. Não imprime
# nenhuma senha (o log do Actions é público).
name: VM - reconhecimento

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vm-reconhecimento.yml

permissions:
  contents: read

jobs:
  vm:
    runs-on: ubuntu-latest
    steps:
      - name: Ler informações da VM
        env:
          VM_IP: ${{ secrets.VM_IP }}
          USER_VM: ${{ secrets.USER_VM }}
          SSHPASS: ${{ secrets.PSW_VM }}
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$USER_VM@$VM_IP" 'bash -s' <<'REMOTO'
          cd /opt/vanguard/app/infra
          echo "== arquivos em /opt/vanguard/app/infra"; ls -la
          echo "== serviço web no compose"; awk '/^  web:/{f=1} f&&/^  [a-z]/&&!/^  web:/{f=0} f' docker-compose.yml | grep -viE 'password|secret|token|key'
          echo "== Caddyfile (fonte)"; for f in $(grep -rl --include='Caddyfile*' . 2>/dev/null; find . -maxdepth 3 -name 'Caddyfile*'); do echo "--- $f"; grep -viE 'password|secret|token|key' "$f"; done | head -80
          echo "== git do vanguard"; (cd /opt/vanguard/app && git log --oneline -1 2>/dev/null && git status --short | head -5) || echo sem git
          REMOTO
