name: VM - reset recompila e testa
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - uses: actions/checkout@v4
      - name: recompila PRMRSS e testa (sem reiniciar)
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          tar -czf /tmp/prmrss-src.tgz -C deploy/protheus/fontes PRMRSS.prw
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo rm -f /tmp/prmrss.tgz' || true
          sshpass -e scp -o StrictHostKeyChecking=accept-new /tmp/prmrss-src.tgz "$USER_VM@$VM_IP:/tmp/prmrss.tgz"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          set -u
          APP=/opt/totvs/protheus12/protheus/bin/appserver
          rm -rf /tmp/fontes-prmrss && mkdir -p /tmp/fontes-prmrss && tar -xzf /tmp/prmrss.tgz -C /tmp/fontes-prmrss
          OUT=$(systemd-run --scope --quiet -p MemoryMax=2G /usr/local/bin/primehub-tdscli compilar base /tmp/fontes-prmrss 2>/dev/null | tail -1)
          echo "compile: $OUT"
          echo "$OUT" | grep -q '"ok": true' || { echo "!! compile falhou"; exit 1; }
          MARK=$(wc -l < $APP/console.log)
          echo "== teste chave errada (espera ok:false chave invalida):"
          curl -s -m 20 -w ' <HTTP %{http_code}>\n' -X POST http://127.0.0.1:8095/rest/prmrss -H 'Content-Type: application/json' --data '{"login":"X","senha":"x","chave":"ERRADA"}'
          echo "== teste chave certa + login inexistente (espera ok:false usuario nao encontrado):"
          curl -s -m 30 -w ' <HTTP %{http_code}>\n' -X POST http://127.0.0.1:8095/rest/prmrss -H 'Content-Type: application/json' --data '{"login":"ZZNAOEXISTE","senha":"x","chave":"PrimeHub@2026"}'
          sleep 2
          echo "== erros novos no console (se houver):"
          tail -n +$MARK $APP/console.log | grep -aviE 'senha|password' | grep -aiE 'thread error|does not exist|Called from REST_PRMRSS|RpcSetEnv|OpenSM0|SM0' | head -20
          echo "== fim"
          R
