name: VM - reset admin real
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: sobe REST e reseta admin para senha conhecida
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          set -u
          B=http://127.0.0.1:8095/rest/prmrss
          Q(){ sudo -u postgres psql -At -d protheus -c "$1" 2>/dev/null; }
          echo "md5 senha admin ANTES: $(Q "SELECT md5(usr_pswmd5) FROM sys_usr WHERE btrim(usr_codigo)='Administrador';")"
          echo "== sobe REST dedicado:"; systemctl start totvsappserver-rest
          for i in $(seq 1 40); do ss -tlnH | grep -q ':8095 ' && break; sleep 3; done; sleep 18
          echo "rest: $(systemctl is-active totvsappserver-rest) | 8095: $(ss -tlnH|grep -q ':8095 '&&echo LISTEN||echo NAO)"
          echo "== RESET admin -> PrimeHub2026 (via REST, no registro ja consistente):"
          curl -s -m 25 -w ' <%{http_code}>\n' -X POST "$B" -H 'Content-Type: application/json' --data '{"login":"Administrador","senha":"PrimeHub2026","chave":"PrimeHub@2026"}'
          sleep 2
          echo "md5 senha admin DEPOIS: $(Q "SELECT md5(usr_pswmd5) FROM sys_usr WHERE btrim(usr_codigo)='Administrador';")"
          R
