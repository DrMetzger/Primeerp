name: VM - reset listar usuarios
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: lista logins de usuarios
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          echo "== tabelas com usr/user:"
          sudo -u postgres psql -At -d protheus -c "SELECT table_name FROM information_schema.tables WHERE lower(table_name) ~ 'usr|user' ORDER BY table_name;" 2>/dev/null | head -20
          echo "== procurando colunas de login (usr_id/usr_code):"
          for T in sys_usr sys_usr010 sys_usrpol; do
            C=$(sudo -u postgres psql -At -d protheus -c "SELECT string_agg(column_name,',') FROM information_schema.columns WHERE lower(table_name)='$T' AND lower(column_name) ~ 'login|code|id|nome|name|bloq';" 2>/dev/null)
            [ -n "$C" ] && echo "tabela $T -> [$C]"
          done
          echo "== logins (sys_usr):"
          sudo -u postgres psql -d protheus -c "SELECT usr_id, usr_code, usr_name, usr_bloqueado FROM sys_usr ORDER BY usr_code LIMIT 30;" 2>/dev/null \
            || sudo -u postgres psql -d protheus -c "SELECT usr_id, usr_codigo, usr_nome FROM sys_usr LIMIT 30;" 2>/dev/null \
            || echo "(ajustar nome da tabela/colunas)"
          R
