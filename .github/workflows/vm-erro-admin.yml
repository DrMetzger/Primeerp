name: VM - ver erro compilacao PRMADM
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: dump saida/exec do tdscli
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          echo "######## saida.txt (cru) ########"
          sed -e 's/[0-9a-fA-F]\{64,\}/<hex>/g' /opt/totvs/tdscli/compilar/saida.txt 2>/dev/null | grep -aviE 'password|senha' | tail -60
          echo ""
          echo "######## exec.log (cru) ########"
          sed -e 's/[0-9a-fA-F]\{64,\}/<hex>/g' /opt/totvs/tdscli/compilar/exec.log 2>/dev/null | grep -aviE 'password|senha' | tail -40
          echo ""
          echo "######## problems*/*.json se houver ########"
          find /opt/totvs/tdscli /tmp -iname 'problem*' -mmin -60 2>/dev/null | head
          R
