name: VM - ver erro compilacao PRMADM
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: status REST + saida.txt do tdscli
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          echo "== AppServer REST ativo?"
          systemctl is-active totvsappserver-rest 2>/dev/null || echo "(inativo!)"
          pgrep -af 'appserver_rest.ini' | head -1 || echo "(processo REST ausente!)"
          echo ""
          echo "== saida/exec/cli do tdscli (ultimo compile)"
          for f in /opt/totvs/tdscli/compilar/saida.txt /opt/totvs/tdscli/compilar/exec.log /opt/totvs/tdscli/compilar/cli.log; do
            echo ""
            echo "===== $f ($(date -r "$f" '+%H:%M' 2>/dev/null)) ====="
            grep -aiE 'PRMADM|PRMRSSLIB|PRMNEWU|error|erro|C[0-9]{4}|syntax|undefined|was not|cannot|invalid|duplicat|open repository|temporarily|build' "$f" 2>/dev/null | grep -aviE 'senha|password|ciphertext' | tail -30
          done
          R
