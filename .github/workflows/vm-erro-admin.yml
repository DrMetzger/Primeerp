name: VM - ver erro compilacao PRMADM
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: contexto apos Compiling PRMADMLIB
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          CON=/opt/totvs/protheus12/protheus/bin/appserver/console.log
          N=$(grep -an 'Compiling PRMADMLIB.prw' "$CON" | tail -1 | cut -d: -f1)
          echo "(ultima Compiling PRMADMLIB.prw na linha $N)"
          sed -n "${N},$((N+40))p" "$CON" 2>/dev/null | sed -e 's/[0-9a-fA-F]\{40,\}/<hex>/g' | grep -aviE 'senha|password|USR_PSW|ULTSPSW|multiport|unrecognized|licenseserver|NOTIFY THREAD'
          R
