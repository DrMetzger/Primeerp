name: VM - reset selftest completo
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - uses: actions/checkout@v4
      - name: compila e prova CRIAR/RESET/APAGAR com login real
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          tar -czf /tmp/prmrss-src.tgz -C deploy/protheus/fontes PRMRSS.prw
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo rm -f /tmp/prmrss.tgz' || true
          sshpass -e scp -o StrictHostKeyChecking=accept-new /tmp/prmrss-src.tgz "$USER_VM@$VM_IP:/tmp/prmrss.tgz"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          set -u
          B=http://127.0.0.1:8095/rest/prmrss
          T=http://127.0.0.1:8095/rest/api/oauth2/v1/token
          rm -rf /tmp/fontes-prmrss && mkdir -p /tmp/fontes-prmrss && tar -xzf /tmp/prmrss.tgz -C /tmp/fontes-prmrss
          OUT=$(systemd-run --scope --quiet -p MemoryMax=2G /usr/local/bin/primehub-tdscli compilar base /tmp/fontes-prmrss 2>/dev/null | tail -1)
          echo "compile: $OUT"
          if ! echo "$OUT" | grep -q '"ok": true'; then
            echo "!! compile falhou - saida.txt:"; grep -aiE 'PRMRSS.PRW\(|SERVER MESSAGE|C[0-9]{4}|FATAL|Warning|error' /opt/totvs/tdscli/compilar/cli.log 2>/dev/null | grep -aviE 'senha|password|security_manager|ciphertext|INFO\|' | tail -20
            exit 1
          fi
          echo "== aguardando REST 8095 voltar apos reload do RPO"; for i in $(seq 1 30); do ss -tlnH | grep -q ':8095 ' && curl -s -o /dev/null -m 5 "$B" && break; sleep 3; done; sleep 3
          post(){ curl -s -m 30 -w ' <%{http_code}>\n' -X POST "$B" -H 'Content-Type: application/json' --data "$1"; }
          tok(){ curl -s -m 20 -w ' <%{http_code}>\n' -X POST "$T" --data-urlencode "grant_type=password" --data-urlencode "username=$1" --data-urlencode "password=$2" | sed -E 's/("access_token":"[A-Za-z0-9._-]{6})[^"]*"/\1...TOKEN_OK"/'; }
          echo "1) CRIAR TSTPRIME:";        post '{"acao":"criar","login":"TSTPRIME","senha":"Prime@2026","chave":"PrimeHub@2026"}'
          echo "2) LOGIN com Prime@2026:";   tok TSTPRIME 'Prime@2026'
          echo "3) RESET para Novo@2026:";   post '{"acao":"reset","login":"TSTPRIME","senha":"Novo@2026","chave":"PrimeHub@2026"}'
          echo "4) LOGIN com Novo@2026:";    tok TSTPRIME 'Novo@2026'
          echo "5) LOGIN senha ANTIGA (deve falhar):"; tok TSTPRIME 'Prime@2026'
          echo "6) APAGAR TSTPRIME:";        post '{"acao":"apagar","login":"TSTPRIME","chave":"PrimeHub@2026"}'
          echo "7) RESET em apagado (deve dar nao encontrado):"; post '{"acao":"reset","login":"TSTPRIME","senha":"x","chave":"PrimeHub@2026"}'
          echo "== base: $(systemctl is-active totvsappserver) | 8089: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/)"
          R
