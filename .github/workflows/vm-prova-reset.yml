name: VM - prova reset admin
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: prova gravacao real via hash no banco
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          B=http://127.0.0.1:8095/rest/prmrss
          Q(){ sudo -u postgres psql -At -d protheus -c "$1" 2>/dev/null; }
          PWDCOL=$(Q "SELECT column_name FROM information_schema.columns WHERE lower(table_name)='sys_usr' AND lower(column_name) ~ 'senha|psw|pass|crip' ORDER BY column_name LIMIT 1;")
          echo "coluna de senha em sys_usr: [$PWDCOL]"
          [ -z "$PWDCOL" ] && { echo "nao achei coluna de senha"; Q "SELECT string_agg(column_name,', ') FROM information_schema.columns WHERE lower(table_name)='sys_usr';"; exit 1; }
          hash(){ Q "SELECT md5(coalesce($PWDCOL,'')) FROM sys_usr WHERE btrim(usr_codigo)='Administrador';"; }
          H0=$(hash); echo "hash senha ANTES:        $H0"
          echo "-- reset Administrador -> PrmHub@Temp1:"
          curl -s -m 25 -w ' <%{http_code}>\n' -X POST "$B" -H 'Content-Type: application/json' --data '{"login":"Administrador","senha":"PrmHub@Temp1","chave":"PrimeHub@2026"}'
          sleep 2; H1=$(hash); echo "hash senha DEPOIS reset:  $H1"
          echo "-- restaura Administrador -> (em branco):"
          curl -s -m 25 -w ' <%{http_code}>\n' -X POST "$B" -H 'Content-Type: application/json' --data '{"login":"Administrador","senha":"","chave":"PrimeHub@2026"}'
          sleep 2; H2=$(hash); echo "hash senha RESTAURADO:    $H2"
          echo "=== VEREDITO ==="
          [ "$H0" != "$H1" ] && echo "PROVA OK: hash mudou apos reset (gravacao real confirmada)" || echo "FALHA: hash nao mudou"
          echo "-- login admin ainda funciona? (compile usa admin):"
          D=$(mktemp -d); printf 'User Function XADMOK()\nReturn .T.\n' > $D/xadmok.prw
          systemd-run --scope --quiet -p MemoryMax=2G /usr/local/bin/primehub-tdscli compilar base "$D" 2>/dev/null | tail -1
          rm -rf $D
          echo "webapp 8089: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/)"
          R
