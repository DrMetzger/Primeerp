name: VM - prova reset admin
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - uses: actions/checkout@v4
      - name: recupera base, compila, sobe REST e testa
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          tar -czf /tmp/lib-src.tgz -C deploy/protheus/fontes PRMRSSLIB.prw
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo rm -f /tmp/lib.tgz' || true
          sshpass -e scp -o StrictHostKeyChecking=accept-new /tmp/lib-src.tgz "$USER_VM@$VM_IP:/tmp/lib.tgz"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          set -u
          CC=/usr/local/bin/primehub-tdscli
          B=http://127.0.0.1:8095/rest/prmrss
          APP=/opt/totvs/protheus12/protheus/bin/appserver
          Q(){ sudo -u postgres psql -At -d protheus -c "$1" 2>/dev/null; }
          echo "== recuperacao total: para tudo, mata orfaos, sobe principal limpo"
          systemctl stop totvsappserver totvsappserver-rest 2>/dev/null || true
          pkill -9 -f appsrvlinux 2>/dev/null || true; sleep 5
          systemctl start totvsappserver
          for i in $(seq 1 50); do ss -tlnH | grep -q ':8089 ' && break; sleep 3; done; sleep 30
          echo "principal: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/)"
          echo "== compila LIB (base limpa, sem REST rodando):"
          sudo rm -rf /tmp/f-lib; mkdir -p /tmp/f-lib; tar -xzf /tmp/lib.tgz -C /tmp/f-lib
          OKC=0; for t in 1 2 3 4; do O=$(systemd-run --scope --quiet -p MemoryMax=2G $CC compilar base /tmp/f-lib 2>/dev/null | tail -1); echo "$O" | grep -q '"ok": true' && { OKC=1; echo " compile OK"; break; }; echo " retry$t: $(echo $O | grep -oE '\"erro\":[^}]*' | head -1)"; sleep 10; done
          [ "$OKC" = 1 ] || { echo "!! compile falhou na base limpa"; exit 1; }
          echo "== repara checksum admin (deixa limpo p/ SetCheckSum regravar):"
          Q "UPDATE sys_usr SET usr_chksum='' WHERE btrim(usr_codigo)='Administrador';"
          echo "== sobe REST dedicado:"
          systemctl start totvsappserver-rest
          for i in $(seq 1 40); do ss -tlnH | grep -q ':8095 ' && break; sleep 3; done; sleep 20
          H0=$(Q "SELECT usr_pswmd5 FROM sys_usr WHERE btrim(usr_codigo)='Administrador';")
          echo "md5(senha) ANTES: $(printf %s "$H0" | md5sum | cut -c1-16)"
          MK=$(wc -l < $APP/console_rest.log 2>/dev/null || echo 1)
          RESP=$(curl -s -m 25 -w '<%{http_code}>' -X POST "$B" -H 'Content-Type: application/json' --data '{"login":"Administrador","senha":"PrmHub@Temp1","chave":"PrimeHub@2026"}')
          echo "resposta reset: $RESP"
          sleep 2
          tail -n +$MK $APP/console_rest.log 2>/dev/null | grep -aiE 'does not|THREAD|__|checksum|SETCHECKSUM|line :|Falha' | grep -aviE 'GET,|psw=|password|Started on' | head -5
          H1=$(Q "SELECT usr_pswmd5 FROM sys_usr WHERE btrim(usr_codigo)='Administrador';")
          echo "md5(senha) DEPOIS: $(printf %s "$H1" | md5sum | cut -c1-16)"
          echo "=== VEREDITO ==="
          echo "$RESP" | grep -q '"ok":true' && echo ">>> 200 LIMPO: {ok:true} <<<" || echo "nao 200-ok"
          [ "$H0" != "$H1" ] && echo ">>> GRAVACAO REAL confirmada <<<" || echo "hash igual"
          echo "== restaura admin (senha original em branco + checksum limpo):"
          printf '%s' "$H0" > /tmp/h0.txt
          Q "UPDATE sys_usr SET usr_pswmd5=\$\$$(cat /tmp/h0.txt)\$\$, usr_chksum='' WHERE btrim(usr_codigo)='Administrador';"
          sudo rm -f /tmp/h0.txt
          echo "webapp 8089: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/) | rest: $(systemctl is-active totvsappserver-rest)"
          R
