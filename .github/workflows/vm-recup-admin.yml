name: VM - recuperar admin
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: recupera checksum original do admin e restaura
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          set -u
          Q(){ sudo -u postgres psql -At -d protheus -c "$1" 2>/dev/null; }
          AP=$(Q "SELECT attnum FROM pg_attribute WHERE attrelid='sys_usr'::regclass AND attname='usr_pswmd5';")
          AC=$(Q "SELECT attnum FROM pg_attribute WHERE attrelid='sys_usr'::regclass AND attname='usr_chksum';")
          ACOD=$(Q "SELECT attnum FROM pg_attribute WHERE attrelid='sys_usr'::regclass AND attname='usr_codigo';")
          echo "attnums: pswmd5=$AP chksum=$AC codigo=$ACOD"
          DEC="CASE WHEN get_byte(c,0)&1=1 THEN substring(c from 2) ELSE substring(c from 5) END"
          LIVEPW=$(Q "SELECT md5(usr_pswmd5) FROM sys_usr WHERE btrim(usr_codigo)='Administrador';")
          echo "md5 pswmd5 LIVE: $LIVEPW"
          echo "== tuplas (xmin | md5 pswmd5 | md5 chksum | len chksum | cod):"
          Q "SELECT t_xmin, md5(convert_from((SELECT $DEC FROM (SELECT cols[$AP] c) z),'LATIN1')), md5(convert_from((SELECT $DEC FROM (SELECT cols[$AC] c) z),'LATIN1')), length(convert_from((SELECT $DEC FROM (SELECT cols[$AC] c) z),'LATIN1')), btrim(convert_from((SELECT $DEC FROM (SELECT cols[$ACOD] c) z),'LATIN1')) FROM (SELECT t_xmin, tuple_data_split('sys_usr'::regclass,t_data,t_infomask,t_infomask2,t_bits) cols FROM heap_page_items(get_raw_page('sys_usr',0)) WHERE t_data IS NOT NULL) q ORDER BY t_xmin;" | sed 's/|/ | /g'
          ORIG=$(Q "SELECT convert_from((SELECT $DEC FROM (SELECT cols[$AC] c) z),'LATIN1') FROM (SELECT t_xmin, tuple_data_split('sys_usr'::regclass,t_data,t_infomask,t_infomask2,t_bits) cols FROM heap_page_items(get_raw_page('sys_usr',0)) WHERE t_data IS NOT NULL) q WHERE md5(convert_from((SELECT $DEC FROM (SELECT cols[$AP] c) z),'LATIN1'))='$LIVEPW' AND btrim(convert_from((SELECT $DEC FROM (SELECT cols[$AC] c) z),'LATIN1'))<>'' ORDER BY t_xmin LIMIT 1;")
          echo "chksum original recuperado? len=$(printf %s "$ORIG" | wc -c) md5=$(printf %s "$ORIG" | md5sum | cut -c1-12)"
          if [ -n "$ORIG" ]; then
            printf '%s' "$ORIG" > /tmp/ck.txt
            Q "UPDATE sys_usr SET usr_chksum=\$\$$(cat /tmp/ck.txt)\$\$ WHERE btrim(usr_codigo)='Administrador';"
            sudo rm -f /tmp/ck.txt
            echo "== restaurado. reinicia principal e testa auth:"
            systemctl restart totvsappserver
            for i in $(seq 1 50); do ss -tlnH | grep -q ':8089 ' && break; sleep 3; done; sleep 15
            sudo rm -rf /tmp/f-adm; mkdir -p /tmp/f-adm; printf 'User Function XADM()\nReturn .T.\n' > /tmp/f-adm/xadm.prw
            echo "compile: $(systemd-run --scope --quiet -p MemoryMax=2G /usr/local/bin/primehub-tdscli compilar base /tmp/f-adm 2>/dev/null | tail -1)"
          else
            echo "nao achei tupla original com pswmd5 = LIVE"
          fi
          R
