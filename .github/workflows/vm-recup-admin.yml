name: VM - recuperar admin
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: recupera checksum original do admin e restaura
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          set -u
          Q(){ sudo -u postgres psql -At -d protheus -c "$1" 2>&1; }
          D4="substring(cols[4] from (CASE WHEN get_byte(cols[4],0)&1=1 THEN 2 ELSE 5 END))"
          D16="substring(cols[16] from (CASE WHEN get_byte(cols[16],0)&1=1 THEN 2 ELSE 5 END))"
          D3="substring(cols[3] from (CASE WHEN get_byte(cols[3],0)&1=1 THEN 2 ELSE 5 END))"
          ITEMS="SELECT t_xmin x, tuple_data_split('sys_usr'::regclass,t_data,t_infomask,t_infomask2,t_bits) cols FROM generate_series(0,(pg_relation_size('sys_usr')/8192)::int-1) p, heap_page_items(get_raw_page('sys_usr',p)) WHERE t_data IS NOT NULL"
          LIVEPW=$(Q "SELECT md5(usr_pswmd5) FROM sys_usr WHERE btrim(usr_codigo)='Administrador';")
          echo "md5 pswmd5 LIVE: $LIVEPW"
          echo "== tuplas no heap (xmin | md5 pswmd5 | md5 chksum | len | cod):"
          Q "SELECT x::text::bigint, md5(convert_from($D4,'LATIN1')), md5(convert_from($D16,'LATIN1')), length(convert_from($D16,'LATIN1')), btrim(convert_from($D3,'LATIN1')) FROM ($ITEMS) q ORDER BY x::text::bigint;" | sed 's/|/ | /g'
          echo "== original = tupla mais antiga com pswmd5=LIVE, chksum nao-vazio, cod=Administrador:"
          ORIG=$(Q "SELECT btrim(convert_from($D16,'LATIN1')) FROM ($ITEMS) q WHERE md5(convert_from($D4,'LATIN1'))='$LIVEPW' AND btrim(convert_from($D16,'LATIN1'))<>'' AND btrim(convert_from($D3,'LATIN1'))='Administrador' ORDER BY x::text::bigint LIMIT 1;")
          echo "recuperado: len=$(printf %s "$ORIG" | wc -c) md5=$(printf %s "$ORIG" | md5sum | cut -c1-12)"
          if [ -n "$ORIG" ] && [ "$(printf %s "$ORIG" | wc -c)" -ge 10 ]; then
            printf '%s' "$ORIG" > /tmp/ck.txt
            sudo -u postgres psql -At -d protheus -c "UPDATE sys_usr SET usr_chksum=\$CK\$$(cat /tmp/ck.txt)\$CK\$ WHERE btrim(usr_codigo)='Administrador';"
            sudo rm -f /tmp/ck.txt
            echo "== restaurado. reinicia principal e testa auth do admin:"
            systemctl restart totvsappserver
            for i in $(seq 1 50); do ss -tlnH | grep -q ':8089 ' && break; sleep 3; done; sleep 15
            sudo rm -rf /tmp/f-adm; mkdir -p /tmp/f-adm; printf 'User Function XADM()\nReturn .T.\n' > /tmp/f-adm/xadm.prw
            echo "compile (auth admin): $(systemd-run --scope --quiet -p MemoryMax=2G /usr/local/bin/primehub-tdscli compilar base /tmp/f-adm 2>/dev/null | tail -1)"
          else
            echo "nao recuperou chksum valido"
          fi
          R
