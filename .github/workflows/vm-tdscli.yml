# Instala o compilador TDS-CLI (advpls) na VM e testa compilar+patch na base
# PRIMEERP. O resultado sai como ARTEFATO (o log do Actions está instável).
name: VM - TDS-CLI (compilador)

on:
  workflow_dispatch:
  push:
    paths:
      - deploy/protheus/tdscli.sh
      - .github/workflows/vm-tdscli.yml

permissions:
  contents: read

concurrency:
  group: vm-protheus
  cancel-in-progress: false

jobs:
  vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar e testar o compilador
        env:
          VM_IP: ${{ secrets.VM_IP }}
          USER_VM: ${{ secrets.USER_VM }}
          SSHPASS: ${{ secrets.PSW_VM }}
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25"
          sshpass -e scp -o StrictHostKeyChecking=accept-new deploy/protheus/tdscli.sh "$USER_VM@$VM_IP:/tmp/tdscli.sh"
          echo "== dispara (volta na hora)"; $SSH "$USER_VM@$VM_IP" 'sudo bash /tmp/tdscli.sh iniciar PRIMEERP' || true
          echo "== espera o teste rodar"; sleep 60
          echo "== lê o resultado"; $SSH "$USER_VM@$VM_IP" 'sudo cat /opt/totvs/tdscli/smoke/resultado.txt 2>/dev/null; echo; echo "===PATCH==="; sudo ls -la /opt/totvs/tdscli/smoke/patch/ 2>/dev/null' > resultado.txt 2>&1 || true
          echo "=== resumo ==="; tail -8 resultado.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tdscli-resultado
          path: resultado.txt
          retention-days: 3
