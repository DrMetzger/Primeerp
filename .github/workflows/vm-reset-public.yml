name: VM - reset endpoint publico
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: tornar prmrss publico e testar
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          set -u
          APP=/opt/totvs/protheus12/protheus/bin/appserver
          INI=$APP/appserver.ini
          cp -f $INI $INI.antes-publico
          # adiciona PUBLIC=/prmrss na secao [PRMREST] (logo apos a linha URL=/rest)
          if ! grep -q '^PUBLIC=' $INI; then
            sed -i '/^\[PRMREST\]/,/^\[/{ s#^URL=/rest#URL=/rest\nPUBLIC=prmrss,/prmrss#; }' $INI
            echo "PUBLIC adicionado"
          else
            echo "PUBLIC ja existe"
          fi
          echo "== secao PRMREST agora:"; sed -n '/\[PRMREST\]/,/^\[/p' $INI | grep -aviE 'senha|password'
          systemctl restart totvsappserver
          for i in $(seq 1 40); do ss -tlnH | grep -q ':8089 ' && break; sleep 3; done
          W=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:8089/)
          echo "webapp 8089: $W | appserver: $(systemctl is-active totvsappserver)"
          if [ "$W" != "200" ]; then echo "!! base caiu - restaurando"; cp -f $INI.antes-publico $INI; systemctl restart totvsappserver; for i in $(seq 1 40); do ss -tlnH|grep -q ':8089 '&&break; sleep 3; done; echo "restaurado: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/)"; exit 1; fi
          for i in $(seq 1 30); do ss -tlnH | grep -q ':8095 ' && break; sleep 3; done
          echo "== teste chave errada (espera ok:false chave invalida, NAO 401 do framework)"
          curl -s -m 15 -w ' <HTTP %{http_code}>\n' -X POST http://127.0.0.1:8095/rest/prmrss -H 'Content-Type: application/json' --data '{"login":"X","senha":"x","chave":"ERRADA"}'
          echo "== teste chave certa + login inexistente (espera ok:false usuario nao encontrado)"
          curl -s -m 15 -w ' <HTTP %{http_code}>\n' -X POST http://127.0.0.1:8095/rest/prmrss -H 'Content-Type: application/json' --data '{"login":"ZZNAOEXISTE","senha":"x","chave":"PrimeHub@2026"}'
          R
