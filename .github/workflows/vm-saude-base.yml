name: VM - saude da base
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: estado dos appservers e REST
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          echo "== servicos appserver (systemd)"
          systemctl is-active totvsappserver-rest 2>/dev/null && echo "REST: ativo" || echo "REST: INATIVO"
          systemctl list-units --type=service 2>/dev/null | grep -aiE 'totvs|appserver|protheus' | head
          echo ""
          echo "== processos appserver vivos"
          ps -eo pid,etime,cmd 2>/dev/null | grep -aiE 'appsrvlinux|appserver' | grep -aiv grep | head
          echo ""
          echo "== REST 8095 responde?"
          curl -s -o /dev/null -w "porta 8095 http=%{http_code}\n" --max-time 8 http://127.0.0.1:8095/rest/ 2>/dev/null || echo "8095 sem resposta"
          echo ""
          echo "== ultimas APPMON/REST port no console principal"
          tail -200 /opt/totvs/protheus12/protheus/bin/appserver/console.log 2>/dev/null | grep -aiE 'APPMON|Invalid REST Port|Restart|Build finished|Start Build' | tail -12
          R
