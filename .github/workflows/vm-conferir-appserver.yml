name: VM - conferir appserver
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: esperar e ler console
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          APP=/opt/totvs/protheus12/protheus/bin/appserver
          for i in $(seq 1 25); do ss -tlnH | grep -q ':8089 ' && break; sleep 3; done
          echo "estado: $(systemctl is-active totvsappserver) | NRestarts $(systemctl show totvsappserver -p NRestarts --value) | 8089 $(ss -tlnH|grep -q ':8089 '&&echo ok||echo NAO) | 1234 $(ss -tlnH|grep -q ':1234 '&&echo ok||echo NAO)"
          echo "== console.log fim (erros de init)"
          grep -aiE 'error|fatal|invalid|licen|rpo|cannot|could not|bind|porta|port|started on|listen| init' $APP/console.log 2>/dev/null | grep -aviE 'senha|password' | tail -30
          echo "== journal"; journalctl -u totvsappserver -n 8 --no-pager | tail -8
          R
