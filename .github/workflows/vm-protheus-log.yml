# SÓ LEITURA: fim do log do AppServer, DBAccess e License (não reinicia nada).
name: VM - log do Protheus (só leitura)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vm-protheus-log.yml

permissions:
  contents: read

jobs:
  vm:
    runs-on: ubuntu-latest
    steps:
      - name: Ler logs
        env:
          VM_IP: ${{ secrets.VM_IP }}
          USER_VM: ${{ secrets.USER_VM }}
          SSHPASS: ${{ secrets.PSW_VM }}
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$USER_VM@$VM_IP" 'sudo bash -s' <<'REMOTO'
          APP=/opt/totvs/protheus12/protheus/bin/appserver
          F='senha|password|psw|passwd|secret|token'
          echo "== serviços"; for u in totvsappserver totvsdbaccess licenseVirtual postgresql@16-main; do echo "$u: $(systemctl is-active $u) desde $(systemctl show $u -p ActiveEnterTimestamp --value) mem $(( $(systemctl show $u -p MemoryCurrent --value 2>/dev/null || echo 0) / 1048576 )) MB"; done
          echo "== chaves de login/interface no appserver (webapp.so + appsrvlinux)"
          for bin in $APP/webapp.so $APP/appsrvlinux; do
            grep -aoE "[[:print:]]{5,}" "$bin" 2>/dev/null
          done | grep -iE "newlogin|loginpage|po[-_ ]?ui|oldlogin|classiclogin|legacylogin|smartclient html|firstaccess|primeiro acesso|disablenewui|newui|login_page|htmlwizard" | sort -u | head -40
          echo "== SIGACFG/usuários: bases SIX/SYS no banco"; sudo -u postgres psql -d protheus -tAc "select table_name from information_schema.tables where table_schema='public' and (table_name ilike 'sys_user%' or table_name ilike 'sys_comp%' or table_name='six010') order by 1" 2>/dev/null | head
          echo "== quantos usuários em SYS_USR (se existir)"; sudo -u postgres psql -d protheus -tAc "select count(*) from sys_usr" 2>/dev/null || echo "sem SYS_USR"
          echo "== webapp.log"; tail -40 $APP/webapp.log 2>/dev/null
          REMOTO
