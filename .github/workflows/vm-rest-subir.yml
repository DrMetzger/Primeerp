name: VM - rest subir instancia
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: remove PrepareIn e testa POST
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          set -u
          D=/opt/totvs/protheus12/protheus/bin/appserver
          INI=$D/appserver_rest.ini
          sed -i '/^PrepareIn=/d' $INI
          echo "== [HTTPURI] agora:"; sed -n '/^\[HTTPURI\]/,$p' $INI | grep -aviE 'senha|password'
          systemctl restart totvsappserver-rest
          for i in $(seq 1 40); do ss -tlnH | grep -q ':8095 ' && break; sleep 3; done
          echo "rest-service: $(systemctl is-active totvsappserver-rest) | 8095: $(ss -tlnH|grep -q ':8095 '&&echo LISTEN||echo NAO)"
          echo "== aguarda WSRESTFUL registrar (~20s)"; sleep 20
          echo "== POST login inexistente (espera ok:false usuario nao encontrado):"
          for t in 1 2 3 4 5; do
            O=$(curl -s -m 20 -w ' <%{http_code}>' -X POST http://127.0.0.1:8095/rest/prmrss -H 'Content-Type: application/json' --data '{"login":"ZZNAOEXISTE","senha":"x","chave":"PrimeHub@2026"}')
            echo " t$t:$O"; echo "$O" | grep -q '200>' && break; sleep 8
          done
          echo "== POST chave errada (espera 401):"
          curl -s -m 20 -w ' <%{http_code}>\n' -X POST http://127.0.0.1:8095/rest/prmrss -H 'Content-Type: application/json' --data '{"login":"X","senha":"x","chave":"ERRADA"}'
          echo "principal: $(systemctl is-active totvsappserver) | 8089: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/)"
          R
