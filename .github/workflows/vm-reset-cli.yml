name: VM - reset cli log
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: dump saida.txt cru
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          echo "===== saida.txt ====="; cat /opt/totvs/tdscli/compilar/saida.txt 2>/dev/null | grep -aviE 'senha|password'
          echo "===== linhas com PRMRSS/C-code/FATAL em QUALQUER log ====="
          grep -ariE 'PRMRSS.PRW\([0-9]|C[0-9]{4}|FATAL|syntax' /opt/totvs/tdscli/ 2>/dev/null | grep -aviE 'senha|password' | tail -15
          R
