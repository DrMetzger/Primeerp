name: VM - recuperar RPO custom
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: resetar custom.rpo e subir
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          APO=/opt/totvs/protheus12/protheus/apo
          systemctl stop totvsappserver; sleep 3; pkill -9 -f appsrvlinux 2>/dev/null || true; sleep 1
          echo "custom.rpo antes: $(ls -la $APO/custom.rpo 2>/dev/null | awk '{print $5}') bytes"
          [ -s $APO/custom.rpo ] && cp -f $APO/custom.rpo $APO/custom.rpo.corrompido-$(date +%H%M) || true
          : > $APO/custom.rpo; chown totvs:totvs $APO/custom.rpo 2>/dev/null || true
          echo "custom.rpo agora: $(ls -la $APO/custom.rpo | awk '{print $5}') bytes (zerado)"
          systemctl start totvsappserver
          for i in $(seq 1 40); do ss -tlnH | grep -q ':8089 ' && break; sleep 3; done
          echo "appserver: $(systemctl is-active totvsappserver) | 8089 $(ss -tlnH|grep -q ':8089 '&&echo ok||echo NAO) | 1234 $(ss -tlnH|grep -q ':1234 '&&echo ok||echo NAO)"
          grep -aiE 'FATAL|FAILURE TO START|APPMAP|started on port|Webapp' $APO/../bin/appserver/console.log 2>/dev/null | tail -6
          R
