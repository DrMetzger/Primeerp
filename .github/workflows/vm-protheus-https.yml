# Liga o https no Webapp do Protheus e o Caddy em https (corrige a tela branca
# do login 12.1.2510). Desfaz sozinho se o Webapp não responder em https.
name: VM - Webapp do Protheus em https

on:
  workflow_dispatch:
  push:
    paths:
      - deploy/protheus/webapp-https.sh
      - .github/workflows/vm-protheus-https.yml

permissions:
  contents: read

concurrency:
  group: vm-protheus
  cancel-in-progress: false

jobs:
  vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Webapp em https
        env:
          VM_IP: ${{ secrets.VM_IP }}
          USER_VM: ${{ secrets.USER_VM }}
          SSHPASS: ${{ secrets.PSW_VM }}
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e scp -o StrictHostKeyChecking=accept-new deploy/protheus/webapp-https.sh "$USER_VM@$VM_IP:/tmp/webapp-https.sh"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash /tmp/webapp-https.sh'
