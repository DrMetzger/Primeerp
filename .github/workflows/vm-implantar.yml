# Implanta o Prime Hub na VM (suporte.primeerp.com.br). Ver deploy/vm/LEIA-ME.md.
# O log é público: nada de senha aparece aqui (só contagens e status).
name: VM - implantar Prime Hub

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ecstatic-feynman-p65s7l
      - main
    paths-ignore:
      - docs/**
      - .github/workflows/vm-trocar-chave-cofre.yml
      - .github/workflows/vm-protheus.yml
      - .github/workflows/vm-recursos.yml
      - .github/workflows/vm-memoria-appserver.yml
      - .github/workflows/vm-protheus-parar.yml
      - .github/workflows/vm-protheus-appserver.yml
      - .github/workflows/vm-protheus-caddy.yml
      - .github/workflows/vm-protheus-log.yml
      - deploy/protheus/**
      - novo/apps/mobile/**
      - .github/workflows/android-apk.yml

concurrency:
  group: vm-implantar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  implantar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USR: ${{ secrets.FTP_USR }}
      FTP_PSW: ${{ secrets.FTP_PSW }}
      VM_IP: ${{ secrets.VM_IP }}
      USER_VM: ${{ secrets.USER_VM }}
      SSHPASS: ${{ secrets.PSW_VM }}
    steps:
      - uses: actions/checkout@v4

      - name: Empacotar o código
        run: |
          git archive --format=tar.gz -o /tmp/primehub-app.tar.gz HEAD
          echo "pacote: $(du -h /tmp/primehub-app.tar.gz | cut -f1)"
          [ -f deploy/vm/IMPORTAR_BANCO ] && echo "IMPORTAR_BANCO=1" >> "$GITHUB_ENV" || echo "IMPORTAR_BANCO=0" >> "$GITHUB_ENV"

      - name: Exportar o banco na Hostinger (em pedaços, sem depender do cron)
        if: env.IMPORTAR_BANCO == '1'
        run: |
          H="${FTP_HOST#ftp://}"; H="${H%/}"
          printf 'user = "%s:%s"\n' "$FTP_USR" "$FTP_PSW" > ~/.ftp && chmod 600 ~/.ftp
          URL=https://www.primeerp.com.br/AdminPrime/exportar_banco_migracao.php
          # O deploy FTP desse mesmo push pode ainda estar subindo o arquivo.
          for i in $(seq 1 40); do
            c=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL" || true)
            [ "$c" = 403 ] && break; sleep 10
          done
          for f in PRONTO estado.json primehub.sql.gz; do curl -sS -K ~/.ftp -Q "DELE AdminPrime/config/migracao/$f" "ftp://$H/" >/dev/null 2>&1 || true; done
          # Token de uso único: só quem tem o FTP consegue criar.
          TOKEN=$(openssl rand -hex 32); echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > TOKEN
          curl -sS --fail -K ~/.ftp --ftp-create-dirs -T TOKEN "ftp://$H/AdminPrime/config/migracao/TOKEN"; rm -f TOKEN
          for i in $(seq 1 400); do
            r=$(curl -sS -X POST --max-time 60 -d "token=$TOKEN" "$URL" || echo '{"ok":false,"erro":"sem resposta"}')
            if ! echo "$r" | jq -e '.ok' >/dev/null 2>&1; then echo "ERRO: $(echo "$r" | head -c 300)"; exit 1; fi
            if echo "$r" | jq -e '.pronto' >/dev/null; then
              echo "exportado: $(echo "$r" | jq -r .linhas) linhas, $(( $(echo "$r" | jq -r .bytes) / 1024 )) KB em $(echo "$r" | jq -r .segundos)s"
              echo "DUMP_SHA256=$(echo "$r" | jq -r .sha256)" >> "$GITHUB_ENV"; exit 0
            fi
            [ $((i % 10)) = 0 ] && echo "... tabela $(echo "$r" | jq -r .tabela), $(echo "$r" | jq -r .linhas) linhas"
          done
          echo "ERRO: exportação não terminou"; exit 1

      - name: Instalar na VM
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          sshpass -e scp -o StrictHostKeyChecking=accept-new /tmp/primehub-app.tar.gz "$USER_VM@$VM_IP:/tmp/primehub-app.tar.gz"
          $SSH "$USER_VM@$VM_IP" 'sudo mkdir -p /opt/primehub'
          {
            printf 'export FTP_HOST=%q FTP_USR=%q FTP_PSW=%q IMPORTAR_BANCO=%q DUMP_SHA256=%q\n' "$FTP_HOST" "$FTP_USR" "$FTP_PSW" "$IMPORTAR_BANCO" "${DUMP_SHA256:-}"
            cat deploy/vm/instalar.sh
          } | $SSH "$USER_VM@$VM_IP" 'sudo bash -s'

      - name: Apagar a exportação da Hostinger
        if: always() && env.IMPORTAR_BANCO == '1'
        run: |
          H="${FTP_HOST#ftp://}"; H="${H%/}"
          for f in primehub.sql.gz primehub.sql.gz.parcial PRONTO EXPORTAR TOKEN estado.json; do
            curl -sS -K ~/.ftp -Q "DELE AdminPrime/config/migracao/$f" "ftp://$H/" >/dev/null 2>&1 || true
          done
          rm -f ~/.ftp PRONTO
          echo "exportação removida da Hostinger"
