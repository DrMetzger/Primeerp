# SÓ LEITURA: confere se o token do agente está salvo no banco e se a API
# publicada tem a rota. Não imprime o hash nem senha.
name: VM - conferir token do agente

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vm-conferir-token.yml

permissions:
  contents: read

jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: Conferir token
        env:
          VM_IP: ${{ secrets.VM_IP }}
          USER_VM: ${{ secrets.USER_VM }}
          SSHPASS: ${{ secrets.PSW_VM }}
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$USER_VM@$VM_IP" 'sudo bash -s' <<'REMOTO' || true
          echo "INICIO"
          echo "== containers"; docker ps --format '{{.Names}} {{.Status}}' | grep primehub || echo "(sem primehub)"
          echo "== token no banco (presenca e tamanho, sem o valor)"
          docker exec primehub-db sh -lc 'mariadb -uprimehub -p"$MARIADB_PASSWORD" primehub -N -e "SELECT chave, CHAR_LENGTH(valor) FROM configuracoes WHERE chave IN (\"agente_token_hash\",\"ia_chamados_motor\")"' 2>&1 | grep -aviE 'password|insecure|warning' || echo "(query falhou)"
          echo "== total de linhas na tabela configuracoes"
          docker exec primehub-db sh -lc 'mariadb -uprimehub -p"$MARIADB_PASSWORD" primehub -N -e "SELECT COUNT(*) FROM configuracoes"' 2>&1 | grep -aviE 'password|insecure|warning' || echo "(query falhou)"
          echo "== a API publicada tem a rota do token?"
          docker exec primehub-api sh -lc 'grep -c "agente_token_hash" /app/index.mjs 2>/dev/null; grep -c "api/agente/token" /app/index.mjs 2>/dev/null' 2>&1 || echo "(grep falhou)"
          echo "FIM"
          REMOTO
          echo "passo concluido"
