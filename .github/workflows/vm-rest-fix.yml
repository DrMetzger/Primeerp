name: VM - rest fix appmon
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: reescreve secao REST para formato direto e testa estabilidade
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          set -u
          APP=/opt/totvs/protheus12/protheus/bin/appserver
          INI=$APP/appserver.ini
          cp -f $INI $INI.bkp-restfix
          # remove tudo da secao [ONSTART] em diante (nossa config REST ficou no fim) e reescreve
          python3 - "$INI" <<'PY'
import sys,re
p=sys.argv[1]
t=open(p,encoding='latin-1').read()
# corta a partir da primeira secao REST que adicionamos
for mark in ['[ONSTART]']:
    i=t.find(mark)
    if i!=-1:
        t=t[:i].rstrip()+"\n"
        break
rest="""
[ONSTART]
Jobs=HTTPJOB
RefreshRate=120

[HTTPJOB]
Main=HTTP_START
Environment=PRIMEERP

[HTTPV11]
Enable=1
Port=8095
Path=/rest
Environment=PRIMEERP
URIs=PRMREST
PUBLIC=prmrss,/prmrss

[PRMREST]
URL=/rest
Instances=1,2
CORSEnable=1
AllowOrigin=*
Security=0
"""
open(p,'w',encoding='latin-1').write(t+rest)
print("ini reescrito")
PY
          echo "== secao REST agora:"; sed -n '/\[ONSTART\]/,$p' $INI | grep -aviE 'senha|password'
          MARK=$(wc -l < $APP/console.log)
          systemctl restart totvsappserver
          for i in $(seq 1 40); do ss -tlnH | grep -q ':8089 ' && break; sleep 3; done
          W=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:8089/)
          echo "webapp 8089: $W | appserver: $(systemctl is-active totvsappserver)"
          if [ "$W" != "200" ]; then echo "!! base caiu - restaurando"; cp -f $INI.bkp-restfix $INI; systemctl restart totvsappserver; for i in $(seq 1 40); do ss -tlnH|grep -q ':8089 '&&break; sleep 3; done; echo "restaurado 8089: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/)"; exit 1; fi
          for i in $(seq 1 30); do ss -tlnH | grep -q ':8095 ' && break; sleep 3; done
          echo "REST 8095: $(ss -tlnH | grep -q ':8095 ' && echo LISTEN || echo NAO)"
          echo "== compile de teste (checar se APP Monitor flapa):"
          D=$(mktemp -d); printf 'User Function XPRMFLAP()\nReturn .T.\n' > $D/xprmflap.prw
          systemd-run --scope --quiet -p MemoryMax=2G /usr/local/bin/primehub-tdscli compilar base "$D" 2>/dev/null | tail -1
          rm -rf $D
          sleep 2
          echo "== erros APP Monitor/-107 no console apos compile (vazio = estavel):"
          tail -n +$MARK $APP/console.log | grep -aiE 'APP Monitor|-107|Invalid REST Port|terminated by the admin' | grep -aviE 'senha|password' | head -8
          echo "== base final: $(systemctl is-active totvsappserver) | 8089: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/) | 8095: $(ss -tlnH|grep -q ':8095 '&&echo LISTEN||echo NAO)"
          R
