name: VM - rest testar endpoint
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: testa endpoint e estabilidade
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          B=http://127.0.0.1:8095/rest/prmrss
          echo "rest-service: $(systemctl is-active totvsappserver-rest) | 8095: $(ss -tlnH|grep -q ':8095 '&&echo LISTEN||echo NAO)"
          echo "== endpoint agora (ate 6 tentativas):"
          for t in 1 2 3 4 5 6; do
            R=$(curl -s -m 15 -w ' <%{http_code}>' -X POST "$B" -H 'Content-Type: application/json' --data '{"login":"ZZNAOEXISTE","senha":"x","chave":"PrimeHub@2026"}')
            echo " t$t:$R"; echo "$R" | grep -q '200>' && break; sleep 8
          done
          echo "== estabilidade 90s (porta cai?):"
          UP=0; DOWN=0
          for i in $(seq 1 9); do ss -tlnH | grep -q ':8095 ' && UP=$((UP+1)) || DOWN=$((DOWN+1)); sleep 10; done
          echo "8095: $UP/9 amostras UP, $DOWN DOWN"
          echo "== conflito 32033 no journal do rest:"
          journalctl -u totvsappserver-rest -n 60 --no-pager 2>/dev/null | sed -E 's/.*appsrvlinux(\[[0-9]+\])?: //' | grep -aiE 'Invalid REST Port|Fail to Restart|already|bind|32033|conflito' | grep -aviE 'senha|password' | tail -6
          echo "principal: $(systemctl is-active totvsappserver) | 8089: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/)"
          R
