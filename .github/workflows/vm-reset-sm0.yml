name: VM - reset achar SM0
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: descobre empresa/filial
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          APP=/opt/totvs/protheus12/protheus/bin/appserver
          echo "== config de dados no appserver.ini (sem senha):"
          grep -aiE 'RootPath|StartPath|^DBAccess|TopDataBase|DBServer|dbaccess|Alias|^Driver' $APP/appserver.ini | grep -aviE 'senha|password' | head
          echo "== appserver.ini secoes de empresa/SM0 se existirem:"
          grep -aiE 'Environment=|^\[PRIMEERP\]|SM0|sigamat' $APP/appserver.ini | grep -aviE 'senha|password' | head
          echo "== arquivos sigamat.* (ctree) na arvore de dados:"
          RP=$(grep -aiE '^RootPath=' $APP/appserver.ini | head -1 | cut -d= -f2 | tr -d '\r')
          echo "RootPath=$RP"
          find "$RP" -iname 'sigamat.*' -o -iname 'sm0*.dtc' 2>/dev/null | head
          echo "== dbaccess rodando? (SQL):"
          ss -tlnp 2>/dev/null | grep -aiE ':7890|:1433|:5432|:3050|dbaccess' | head
          ps -ef | grep -aiE 'dbaccess|postgres|sqlserver|oracle' | grep -av grep | head
          R
