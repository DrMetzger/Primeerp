name: VM - reparar checksum
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: desliga MV_INTEGPW e testa auth
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          set -u
          CC=/usr/local/bin/primehub-tdscli
          Q(){ sudo -u postgres psql -At -d protheus -c "$1" 2>/dev/null; }
          echo "== MV_INTEGPW antes: $(Q "SELECT btrim(x6_conteud) FROM sx6990 WHERE btrim(x6_var)='MV_INTEGPW';")"
          Q "UPDATE sx6990 SET x6_conteud='0', x6_conteud2='0' WHERE btrim(x6_var)='MV_INTEGPW';" 2>/dev/null || Q "UPDATE sx6990 SET x6_conteud='0' WHERE btrim(x6_var)='MV_INTEGPW';"
          echo "== MV_INTEGPW depois: $(Q "SELECT btrim(x6_conteud) FROM sx6990 WHERE btrim(x6_var)='MV_INTEGPW';")"
          echo "== reinicia principal p/ recarregar SX6:"
          systemctl restart totvsappserver
          for i in $(seq 1 50); do ss -tlnH | grep -q ':8089 ' && break; sleep 3; done; sleep 20
          echo "principal 8089: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/)"
          echo "== compila UF trivial (auth do admin):"
          W=$(mktemp -d); printf 'User Function XCHK()\nReturn .T.\n' > $W/xchk.prw
          systemd-run --scope --quiet -p MemoryMax=2G $CC compilar base "$W" 2>/dev/null | tail -1
          sudo rm -rf "$W"
          R
