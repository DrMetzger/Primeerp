name: VM - reset estado
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: estado base e REST + teste
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          echo "appserver: $(systemctl is-active totvsappserver)"
          echo "webapp 8089: $(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:8089/)"
          echo "esperando REST 8095..."; for i in $(seq 1 30); do ss -tlnH | grep -q ':8095 ' && break; sleep 3; done
          ss -tlnH | grep -q ':8095 ' && echo "8095: LISTEN" || echo "8095: NAO"
          echo "== teste chave certa + login inexistente:"
          curl -s -m 30 -w ' <HTTP %{http_code}>\n' -X POST http://127.0.0.1:8095/rest/prmrss -H 'Content-Type: application/json' --data '{"login":"ZZNAOEXISTE","senha":"x","chave":"PrimeHub@2026"}'
          APP=/opt/totvs/protheus12/protheus/bin/appserver
          echo "== ultimo thread error no console (se houver):"
          grep -an 'THREAD ERROR\|does not exist\|REST_PRMRSS' $APP/console.log | tail -6 | grep -aviE 'senha|password'
          R
