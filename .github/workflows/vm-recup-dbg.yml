name: VM - recup debug
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: debug pageinspect
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          QE(){ sudo -u postgres psql -At -d protheus -c "$1" 2>&1; }
          echo "== tamanho real sys_usr:"; QE "SELECT pg_relation_size('sys_usr'), pg_relation_filepath('sys_usr');"
          echo "== itens na pagina 0 (com erro visivel):"; QE "SELECT count(*) FROM heap_page_items(get_raw_page('sys_usr',0));"
          echo "== lp_off/lp_len/t_xmin dos itens pagina 0:"; QE "SELECT lp, lp_off, lp_len, t_xmin, (t_data IS NOT NULL) tem_dado FROM heap_page_items(get_raw_page('sys_usr',0)) ORDER BY lp;"
          R
