name: VM - rest estrutura correta + selftest
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - uses: actions/checkout@v4
      - name: aplica REST (HTTPURI/PrepareIn) e prova reset com login real
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          tar -czf /tmp/prmrss-src.tgz -C deploy/protheus/fontes PRMRSS.prw PRMRSSLIB.prw
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo rm -f /tmp/prmrss.tgz' || true
          sshpass -e scp -o StrictHostKeyChecking=accept-new /tmp/prmrss-src.tgz "$USER_VM@$VM_IP:/tmp/prmrss.tgz"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          set -u
          APP=/opt/totvs/protheus12/protheus/bin/appserver
          INI=$APP/appserver.ini
          B=http://127.0.0.1:8095/rest/prmrss
          T=http://127.0.0.1:8095/rest/api/oauth2/v1/token
          CC=/usr/local/bin/primehub-tdscli
          cp -f $INI $INI.bkp-restok
          sed -i '/^\[ONSTART\]/,$d' $INI
          CFG='\n[ONSTART]\nJobs=HTTPJOB\nRefreshInterval=60\n\n[HTTPJOB]\nMain=HTTP_START\nEnvironment=PRIMEERP\n\n[HTTPV11]\nEnable=1\nSockets=HTTPREST\n\n[HTTPREST]\nPort=8095\nURIs=HTTPURI\nSecurity=0\n\n[HTTPURI]\nURL=/rest\nPrepareIn=99\nCORSEnable=1\nAllowOrigin=*\nPUBLIC=prmrss,/prmrss\n'
          printf "$CFG" >> $INI
          echo "== secao REST:"; sed -n '/\[ONSTART\]/,$p' $INI | grep -aviE 'senha|password'
          MARK=$(wc -l < $APP/console.log)
          systemctl restart totvsappserver
          for i in $(seq 1 40); do ss -tlnH | grep -q ':8089 ' && break; sleep 3; done
          W=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:8089/)
          echo "webapp 8089: $W | appserver: $(systemctl is-active totvsappserver)"
          if [ "$W" != "200" ]; then echo "!! base caiu - restaurando"; cp -f $INI.bkp-restok $INI; systemctl restart totvsappserver; for i in $(seq 1 40); do ss -tlnH|grep -q ':8089 '&&break; sleep 3; done; echo "restaurado 8089: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/)"; exit 1; fi
          for i in $(seq 1 30); do ss -tlnH | grep -q ':8095 ' && break; sleep 3; done
          echo "REST 8095: $(ss -tlnH | grep -q ':8095 ' && echo LISTEN || echo NAO)"
          echo "== compila LIB (deve ser estavel agora):"
          rm -rf /tmp/f-lib /tmp/f-rest && mkdir -p /tmp/f-lib /tmp/f-rest
          tar -xzf /tmp/prmrss.tgz -C /tmp/f-lib  PRMRSSLIB.prw
          tar -xzf /tmp/prmrss.tgz -C /tmp/f-rest PRMRSS.prw
          systemd-run --scope --quiet -p MemoryMax=2G $CC compilar base /tmp/f-lib 2>/dev/null | tail -1
          echo "== compila WSRESTFUL:"
          systemd-run --scope --quiet -p MemoryMax=2G $CC compilar base /tmp/f-rest 2>/dev/null | tail -1
          echo "== erros APP Monitor/-107 apos compiles (vazio = estavel):"
          tail -n +$MARK $APP/console.log | grep -aiE 'APP Monitor|-107|Invalid REST Port|terminated by the admin' | grep -aviE 'senha|password' | head -5
          for i in $(seq 1 30); do ss -tlnH | grep -q ':8095 ' && curl -s -o /dev/null -m 5 "$B" && break; sleep 3; done; sleep 3
          post(){ curl -s -m 30 -w ' <%{http_code}>\n' -X POST "$B" -H 'Content-Type: application/json' --data "$1"; }
          tok(){ curl -s -m 20 -w ' <%{http_code}>\n' -X POST "$T" --data-urlencode "grant_type=password" --data-urlencode "username=$1" --data-urlencode "password=$2" | sed -E 's/("access_token":"[A-Za-z0-9._-]{6})[^"]*"/\1...TOKEN_OK"/'; }
          echo "1) CRIAR TSTPRIME:";        post '{"acao":"criar","login":"TSTPRIME","senha":"Prime@2026","chave":"PrimeHub@2026"}'
          echo "2) LOGIN Prime@2026:";       tok TSTPRIME 'Prime@2026'
          echo "3) RESET Novo@2026:";        post '{"acao":"reset","login":"TSTPRIME","senha":"Novo@2026","chave":"PrimeHub@2026"}'
          echo "4) LOGIN Novo@2026:";        tok TSTPRIME 'Novo@2026'
          echo "5) LOGIN antiga (falha):";   tok TSTPRIME 'Prime@2026'
          echo "6) APAGAR TSTPRIME:";        post '{"acao":"apagar","login":"TSTPRIME","chave":"PrimeHub@2026"}'
          echo "== base final: $(systemctl is-active totvsappserver) | 8089: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/) | 8095: $(ss -tlnH|grep -q ':8095 '&&echo LISTEN||echo NAO)"
          R
