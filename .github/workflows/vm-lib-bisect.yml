name: VM - lib bisect
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - uses: actions/checkout@v4
      - name: restart limpo + retry LIB + bisect por funcao
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          tar -czf /tmp/lib-src.tgz -C deploy/protheus/fontes PRMRSSLIB.prw
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo rm -f /tmp/lib.tgz' || true
          sshpass -e scp -o StrictHostKeyChecking=accept-new /tmp/lib-src.tgz "$USER_VM@$VM_IP:/tmp/lib.tgz"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          set -u
          APP=/opt/totvs/protheus12/protheus/bin/appserver
          CC=/usr/local/bin/primehub-tdscli
          echo "== restart limpo do appserver"
          systemctl restart totvsappserver
          for i in $(seq 1 40); do ss -tlnH | grep -q ':8089 ' && break; sleep 3; done; sleep 5
          echo "8089: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/)"
          rm -rf /tmp/f-lib && mkdir -p /tmp/f-lib && tar -xzf /tmp/lib.tgz -C /tmp/f-lib
          echo "== LIB completa, 4 tentativas:"
          for t in 1 2 3 4; do echo " t$t: $(systemd-run --scope --quiet -p MemoryMax=2G $CC compilar base /tmp/f-lib 2>/dev/null | tail -1)"; sleep 8; done
          echo "== bisect: so U_PRMRSS (deve compilar - ja foi provado):"
          D=/tmp/f-rss; rm -rf $D; mkdir -p $D
          awk '/^User Function PRMRSS\(/{f=1} f{print} /^Return lRet/{if(f==1){print "";exit}}' /tmp/f-lib/PRMRSSLIB.prw > $D/body.txt
          { echo "#include 'protheus.ch'"; echo "#include 'fwmvcdef.ch'"; echo ""; cat $D/body.txt; } > $D/prmrss1.prw
          echo "   so-RSS: $(systemd-run --scope --quiet -p MemoryMax=2G $CC compilar base $D 2>/dev/null | tail -1)"
          echo "== bisect: so U_PRMNEWU:"
          D2=/tmp/f-new; rm -rf $D2; mkdir -p $D2
          awk '/^User Function PRMNEWU\(/{f=1} f{print} f&&/^Return lRet/{c++; if(c==1){print "";exit}}' /tmp/f-lib/PRMRSSLIB.prw > $D2/body.txt
          { echo "#include 'protheus.ch'"; echo "#include 'fwmvcdef.ch'"; echo ""; cat $D2/body.txt; } > $D2/prmnew.prw
          echo "   so-NEWU: $(systemd-run --scope --quiet -p MemoryMax=2G $CC compilar base $D2 2>/dev/null | tail -1)"
          echo "8089 final: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8089/)"
          R
