name: VM - ver ini monitor
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: dump secoes GENERAL/WEBAPP/TCP
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          APP=/opt/totvs/protheus12/protheus/bin/appserver
          I=$APP/appserver.ini.antes-rest; [ -f "$I" ] || I=$APP/appserver.ini
          echo "== [GENERAL] [WEBAPP] [WebApp/webapp] [TCP] (ini pre-REST, sem senha):"
          awk '/^\[(GENERAL|WEBAPP|WebApp\/webapp|TCP|LICENSECLIENT)\]/{p=1} /^\[/ && $0 !~ /GENERAL|WEBAPP|WebApp\/webapp|TCP|LICENSECLIENT/{p=0} p' "$I" | grep -aviE 'senha|password|psw=' | head -60
          R
