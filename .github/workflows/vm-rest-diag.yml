name: VM - rest diag start
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: por que totvsappserver-rest nao sobe
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          D=/opt/totvs/protheus12/protheus/bin/appserver
          echo "== status:"; systemctl status totvsappserver-rest --no-pager 2>&1 | grep -aviE 'senha|password' | head -12
          echo "== journal (ultimas linhas):"; journalctl -u totvsappserver-rest -n 40 --no-pager 2>/dev/null | sed -E 's/.*appsrvlinux(\[[0-9]+\])?://' | grep -aviE 'senha|password' | tail -30
          echo "== ini REST (sem senha):"; grep -aviE 'senha|password|psw=' $D/appserver_rest.ini | head -60
          R
