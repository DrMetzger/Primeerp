name: VM - rest diag start
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: journal atual do rest
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          echo "== 25 linhas cruas mais recentes do journal:"
          journalctl -u totvsappserver-rest -n 25 --no-pager 2>/dev/null | sed -E 's/.*appsrvlinux(\[[0-9]+\])?: //' | grep -aviE 'senha|password' | tail -25
          echo "== console.log do rest existe separado?"; ls -la /opt/totvs/protheus12/protheus/bin/appserver/console*.log 2>/dev/null | head
          R
