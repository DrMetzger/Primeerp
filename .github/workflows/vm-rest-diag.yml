name: VM - rest diag start
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: erro do model no console_rest
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          D=/opt/totvs/protheus12/protheus/bin/appserver
          B=http://127.0.0.1:8095/rest/prmrss
          M=$(wc -l < $D/console_rest.log 2>/dev/null || echo 1)
          curl -s -o /dev/null -m 25 -X POST "$B" -H 'Content-Type: application/json' --data '{"login":"Administrador","senha":"PrmHub@Temp1","chave":"PrimeHub@2026"}'
          sleep 2
          echo "== erro no console_rest apos o POST:"
          tail -n +$M $D/console_rest.log 2>/dev/null | grep -aiE 'PRMRST|PRMRSSLIB|DATAUSER|USR_|FWLOADMODEL|FWUSERACCOUNT|SetValue|does not|nao existe|invalid|error|erro|THREAD ERROR|Called from|GetModel|componente|field|campo' | grep -aviE 'senha|password|GET,' | head -25
          R
