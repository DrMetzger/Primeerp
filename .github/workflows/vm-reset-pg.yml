name: VM - reset pg sm0
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: consulta SM0010 no postgres
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          echo "== bancos:"; sudo -u postgres psql -At -c "SELECT datname FROM pg_database WHERE datistemplate=false;" 2>/dev/null
          for DB in $(sudo -u postgres psql -At -c "SELECT datname FROM pg_database WHERE datistemplate=false AND datname NOT IN ('postgres');" 2>/dev/null); do
            T=$(sudo -u postgres psql -At -d "$DB" -c "SELECT to_regclass('public.sm0010');" 2>/dev/null)
            if [ "$T" = "sm0010" ]; then
              echo "== banco $DB tem sm0010:"
              sudo -u postgres psql -d "$DB" -c "SELECT sm0_codigo, sm0_filial, sm0_nome, sm0_nomecom FROM sm0010 ORDER BY sm0_codigo, sm0_filial LIMIT 20;" 2>/dev/null
            fi
          done
          R
