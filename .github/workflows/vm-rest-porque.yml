name: VM - por que o REST 8095 nao sobe
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: vm-protheus, cancel-in-progress: false }
jobs:
  vm:
    runs-on: [self-hosted, vm]
    steps:
      - name: esperar e ler console_rest
        env: { VM_IP: "${{ secrets.VM_IP }}", USER_VM: "${{ secrets.USER_VM }}", SSHPASS: "${{ secrets.PSW_VM }}" }
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$USER_VM@$VM_IP" 'sudo bash -s' <<'R'
          BIN=/opt/totvs/protheus12/protheus/bin/appserver
          echo "== dando 75s pro job HTTP subir, checando 8095"
          for i in $(seq 1 5); do
            sleep 15
            P=$(ss -tlnH 2>/dev/null | grep -c ':8095 ')
            echo "  +$((i*15))s  8095_listen=$P"
            [ "$P" -ge 1 ] && break
          done
          echo ""
          echo "== console_rest.log (HTTP/REST/porta/erro)"
          tail -200 "$BIN/console_rest.log" 2>/dev/null | grep -aiE 'http|rest|port|8095|job|onstart|start|error|erro|fail|bind|could not|invalid' | grep -aviE 'senha|password' | tail -30
          echo ""
          echo "== systemctl status do REST (resumo)"
          systemctl status totvsappserver-rest --no-pager 2>/dev/null | head -12 | grep -aviE 'senha|password'
          R
