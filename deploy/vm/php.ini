; Mesmos limites da Hostinger (.user.ini), exceto o tempo de execução:
; aqui não tem o limite de 45s da hospedagem compartilhada.
date.timezone = America/Sao_Paulo
upload_max_filesize = 5120M
post_max_size = 5200M
memory_limit = 1024M
max_execution_time = 300
max_input_time = 3600
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off
session.cookie_secure = 1
session.cookie_httponly = 1
