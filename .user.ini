; Prime Hub -- limites de upload (5GB por arquivo, por causa das vídeo
; aulas -- ver VIDEO_AULA_MAX_SIZE em config/config.php).
; Hostinger roda PHP via LiteSpeed/lsphp (LSAPI), que lê .user.ini direto --
; diferente de mod_php, que só respeita php_value dentro de .htaccess. Os
; dois arquivos setam os MESMOS valores de propósito (não sabemos ao certo
; qual mecanismo o plano de hospedagem atual usa) -- redundante, mas nenhum
; dos dois quebra nada se não for o suportado.
;
; max_execution_time NÃO fica em 300s -- ver comentário equivalente no
; .htaccess (causou 504 Gateway Time-out num envio de e-mail que já era
; lento/instável, porque deixou de falhar rápido como antes). max_input_time
; (tempo pra RECEBER o upload, diferente do execution_time acima) sobe bem
; mais (1h) só pra vídeo grande não ser cortado no meio do envio numa
; internet mais lenta.
upload_max_filesize = 5120M
post_max_size = 5200M
memory_limit = 1024M
max_execution_time = 45
max_input_time = 3600
