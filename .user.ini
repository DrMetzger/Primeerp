; Prime Hub -- limites de upload (500MB por arquivo, pedido do Kleber).
; Hostinger roda PHP via LiteSpeed/lsphp (LSAPI), que lê .user.ini direto --
; diferente de mod_php, que só respeita php_value dentro de .htaccess. Os
; dois arquivos setam os MESMOS valores de propósito (não sabemos ao certo
; qual mecanismo o plano de hospedagem atual usa) -- redundante, mas nenhum
; dos dois quebra nada se não for o suportado.
;
; max_execution_time/max_input_time NÃO ficam em 300s -- ver comentário
; equivalente no .htaccess (causou 504 Gateway Time-out num envio de e-mail
; que já era lento/instável, porque deixou de falhar rápido como antes).
upload_max_filesize = 500M
post_max_size = 520M
memory_limit = 1024M
max_execution_time = 45
max_input_time = 90
